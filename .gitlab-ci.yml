# One job: install the project and run it. Network settings mirror the FMM
# pipeline (Harbor base image, corporate proxy, trusted Nexus host).

variables:
  PYTHON_IMAGE: "cdn.harbor.global.lmco.com/lmc.eo.swf.lmified/ext.hub.docker.com/library/python:3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_TRUSTED_HOST: "nexus.global.lmco.com"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  http_proxy: "http://proxy-zsgov.external.lmco.com:80"
  https_proxy: "http://proxy-zsgov.external.lmco.com:80"
  no_proxy: ".lmco.com,localhost,127.0.0.1"
  ETL_ARGS: ""          # e.g. "--publish" or "--publish-tst"; set on the schedule

etl:
  image: $PYTHON_IMAGE
  timeout: 2h
  variables:
    FORCE_SPINNER: "0"
    PYTHONUNBUFFERED: "1"
    # The JDBC fetch runs inside a JVM that JPype starts in-process. Its heap
    # defaults to 25% of container memory, which overflows on the full history
    # query (millions of rows). The JVM reads this variable at startup.
    # 50% leaves room for Python/Polars on an 8 GB runner; 75% starved the host.
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50"
    # Incremental history fetches are small, so parallel queries are fine once
    # the cache is seeded. Set to "0" for one query at a time.
    ETL_PARALLEL_FETCH: "1"
    # Refuse to run without the history caches (seeded below or restored from
    # the GitLab cache). The full-history bootstrap takes hours on a small
    # runner; do it once from a workstation and upload the parquet files
    # (README "Seeding the history cache"). Set to "0" to allow the bootstrap.
    ETL_REQUIRE_CACHE: "1"
    # Stream results in chunks of this many rows (execute_query chunksize) so the
    # full history query never sits whole in Java or pandas.
    ETL_FETCH_CHUNKSIZE: "100000"
    # csm_commonlib's JDBC query timeout (default 300 s) is too short for the
    # full history query; 0 disables it.
    CSM_TIBCO_QUERY_TIMEOUT_SECONDS: "0"
    # History caches can be seeded from the project's generic package registry
    # (package "history-cache", version "seed") so a fresh runner does not have
    # to run the multi-million-row full history query. See README.
    CACHE_SEED_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/history-cache/seed"
  cache:
    - key: etl-history-cache      # incremental history parquet, kept between runs
      paths:
        - cache/
    - key: pip-cache
      paths:
        - .pip-cache/
  before_script:
    # Memory available to this job (the JVM heap is a percentage of it).
    - echo "cgroup memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null)"; free -m || true
    # Seed the history caches if the GitLab cache came back empty.
    - mkdir -p cache
    - |
      for f in stories_history_cache.parquet epics_history_cache.parquet; do
        if [ ! -s "cache/$f" ]; then
          echo "cache/$f missing - trying seed from package registry"
          curl -sSf --header "JOB-TOKEN: $CI_JOB_TOKEN" -o "cache/$f" "$CACHE_SEED_URL/$f"             && echo "seeded cache/$f ($(du -h cache/$f | cut -f1))"             || { rm -f "cache/$f"; echo "no seed for $f"; }
        fi
      done
      if [ "$ETL_REQUIRE_CACHE" = "1" ]; then
        for f in stories_history_cache.parquet epics_history_cache.parquet; do
          if [ ! -s "cache/$f" ]; then
            echo "ERROR: cache/$f is missing and no seed is published. Upload it to the package registry"
            echo "       (README: Seeding the history cache) or set ETL_REQUIRE_CACHE=0 to run the full history query."
            exit 1
          fi
        done
      fi
    # csm_commonlib talks to Tibco over JDBC (jaydebeapi/JPype), which needs a
    # JVM. The Python image has none, so install a headless JRE. apt goes out
    # through http_proxy/https_proxy set above.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends default-jre-headless
    - export JAVA_HOME=/usr/lib/jvm/default-java
    - test -f "$JAVA_HOME/lib/server/libjvm.so" && echo "JVM OK ($JAVA_HOME)"
    # pip installs csm-commonlib by cloning it from this GitLab (see
    # requirements.txt). Authenticate the clone with the job token, and make
    # git trust GitLab's certificate using the CA file the runner already uses
    # for its own checkout (set when the runner has tls-ca-file configured).
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "https://${CI_SERVER_HOST}/"
    - if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ]; then export GIT_SSL_CAINFO="$CI_SERVER_TLS_CA_FILE"; fi
    - pip install -r requirements.txt
  script:
    - python main.py --test
    - python main.py $ETL_ARGS
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - output/
      - logs/
