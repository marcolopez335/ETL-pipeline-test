<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- The page has its own dark and light themes. Tell dark-mode browser
         extensions (Dark Reader honours this tag) not to recolor it: when they
         rewrite the CSS variables, every panel, meter and chart line vanishes. -->
    <meta name="darkreader-lock" />
    <title>Program Metrics</title>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by the app on its first render. If this text stays on
           screen, the JavaScript never ran. -->
      <p style="font: 14px system-ui, sans-serif; color: #c3c2b7; padding: 24px">Loading Program Metrics&hellip; (if this line stays, the app script did not run)</p>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
